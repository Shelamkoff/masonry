<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Masonry layout demo">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>▦</text></svg>">
  <title>Masonry — live demo</title>
  <link rel="stylesheet" href="./styles/masonry.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #080a0f;
      color: #f4f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .toolbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .7rem;
      padding: .9rem max(1rem, calc((100vw - 1220px) / 2));
      border-bottom: 1px solid #242936;
      background: rgba(8, 10, 15, .86);
      backdrop-filter: blur(18px);
    }
    .brand { margin-right: auto; }
    h1 { margin: 0; font-size: 1.15rem; }
    .status { color: #8f9ab1; font-size: .76rem; }
    button, select {
      min-height: 38px;
      border: 1px solid #343c51;
      border-radius: 10px;
      padding: 0 .8rem;
      color: #edf2ff;
      background: #151a25;
      font: inherit;
      font-size: .82rem;
    }
    button { cursor: pointer; }
    button:hover, select:hover { background: #222a3a; }
    button.primary {
      border-color: #768cff;
      background: #5c70df;
    }
    main {
      width: min(100% - 2rem, 1220px);
      margin: 2rem auto 8rem;
    }
    .intro {
      max-width: 720px;
      margin-bottom: 1.6rem;
      color: #aab3c7;
      line-height: 1.65;
    }
    .card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 18px;
      background: linear-gradient(145deg, #181f30, #10141f);
      box-shadow: 0 16px 55px rgba(0, 0, 0, .22);
      cursor: pointer;
    }
    .card:hover { border-color: rgba(143, 165, 255, .55); }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      background: #131824;
    }
    .card__body { padding: 1rem; }
    .card__eyebrow {
      color: #8fa5ff;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .card h2 { margin: .4rem 0 .5rem; font-size: 1rem; }
    .card p { margin: 0; color: #9fa9bd; font-size: .84rem; line-height: 1.55; }
    .masonry-sentinel { bottom: -1px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@shelamkoff/event-bus": "https://esm.sh/@shelamkoff/event-bus@1.0.0",
        "@shelamkoff/infinite-scroll": "https://shelamkoff.github.io/infinite-scroll/src/index.js"
      }
    }
  </script>
</head>
<body data-status="loading">
  <header class="toolbar">
    <div class="brand">
      <h1>Masonry</h1>
      <div class="status" id="status">Starting…</div>
    </div>
    <select id="mode" aria-label="Layout mode">
      <option value="masonry">Masonry</option>
      <option value="row">Rows</option>
      <option value="column">Columns</option>
    </select>
    <button class="primary" id="add" type="button">Add 6 cards</button>
    <button id="wide" type="button">Add wide card</button>
    <button id="remove" type="button">Remove last</button>
  </header>

  <main>
    <p class="intro">
      Three responsive layout modes, multi-column cards, media-aware
      measurement, animated relayout, and delegated item events. Add or
      remove cards, resize the browser, or switch modes to recalculate the grid.
    </p>
    <section id="grid" aria-live="polite"></section>
  </main>

  <script type="module">
    import { Masonry } from './src/index.js'

    const grid = document.querySelector('#grid')
    const status = document.querySelector('#status')
    const mode = document.querySelector('#mode')
    const addButton = document.querySelector('#add')
    const wideButton = document.querySelector('#wide')
    const removeButton = document.querySelector('#remove')
    const controls = [mode, addButton, wideButton, removeButton]
    let masonry
    let counter = 0
    let actionQueue = Promise.resolve()
    const copy = [
      'A compact note with only a few lines.',
      'Responsive layouts should preserve rhythm while adapting to every viewport.',
      'Media is measured only after it is ready, so the grid avoids late jumps.',
      'One append operation is completed before the next begins.',
      'Column spans let featured stories occupy more visual space.',
    ]

    function createCard({ image = false, span = 1 } = {}) {
      counter += 1
      const element = document.createElement('article')
      element.className = 'card'
      const text = copy[counter % copy.length]
      const imageHeight = 170 + (counter % 4) * 38
      element.innerHTML = `
        ${image ? `<img src="https://picsum.photos/seed/masonry-${counter}/720/${imageHeight}" alt="" loading="eager">` : ''}
        <div class="card__body">
          <div class="card__eyebrow">${span > 1 ? 'Featured' : 'Entry'} ${counter}</div>
          <h2>${image ? 'Media-aware card' : 'Layout-ready content'}</h2>
          <p>${text}</p>
        </div>
      `
      return {
        id: `card-${counter}`,
        element,
        colSpan: span,
      }
    }

    function makeBatch(size) {
      return Array.from({ length: size }, (_, index) =>
        createCard({ image: index % 3 === 0 }),
      )
    }

    async function appendBatch(size = 6) {
      status.textContent = 'Measuring cards…'
      await masonry.append(makeBatch(size))
      status.textContent = `${masonry.getItems().length} cards · ${masonry.getColumnCount()} columns`
    }

    function createMasonry(items = []) {
      masonry = new Masonry(grid, {
        columnWidth: 245,
        gap: 16,
        layoutMode: mode.value,
      })
      masonry.on('item:click', ({ item }) => {
        status.textContent = `Clicked ${item.id}`
      })
      return items.length > 0 ? masonry.append(items) : Promise.resolve()
    }

    function setBusy(value) {
      grid.setAttribute('aria-busy', String(value))
      for (const control of controls) control.disabled = value
    }

    function runAction(action) {
      actionQueue = actionQueue.then(async () => {
        setBusy(true)
        try {
          await action()
        } catch (error) {
          status.textContent = `Action failed: ${error.message}`
        } finally {
          setBusy(false)
        }
      })
      return actionQueue
    }

    mode.addEventListener('change', () => {
      void runAction(async () => {
        const items = masonry.getItems()
        masonry.destroy()
        await createMasonry(items)
        status.textContent = `${items.length} cards · ${mode.value} mode`
      })
    })
    addButton.addEventListener('click', () => {
      void runAction(() => appendBatch())
    })
    wideButton.addEventListener('click', () => {
      void runAction(async () => {
        await masonry.append([createCard({ image: true, span: 2 })])
        status.textContent = `${masonry.getItems().length} cards · wide card added`
      })
    })
    removeButton.addEventListener('click', () => {
      void runAction(() => {
        const items = masonry.getItems()
        if (items.length === 0) return
        masonry.remove(items.at(-1).id)
        status.textContent = `${masonry.getItems().length} cards`
      })
    })

    await createMasonry()
    await appendBatch(12)
    document.body.dataset.status = 'pass'
  </script>
</body>
</html>
